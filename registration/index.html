<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>

  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="background-gradient">

  </div>
  <div class="content">
    <h1 class="headline h1">Willkommen bei JungleSounds!</h1>
    <p class="body-l">Registriere dich um Musik zu hören und die Welt wieder Grün zu gestalten!</p>
    <form action="#" method="get" class="grid body-m">
      <div class="field">
        <label for="name">Dein Name</label>
        <input type="text" id="name" name="name" class="body-m"/>
      </div>
      <div class="field">
        <label for="mail">Dein E-Mail</label>
        <input type="email" id="mail" name="email" class="body-m"/>
      </div>
      <div class="field">
        <label for="passwd">Dein Passwort</label>
        <input type="password" id="passwd" name="password" class="body-m"/>
      </div>
      <div class="actions">
        <input type="submit" value="Ich bin Dabei!" class="button primary body-m"/>
        <a href="/" class="button secondary">Zurück zur Startseite</a>
      </div>
    </form>
  </div>
</body>
</html>
